name: Bridge zipalign runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bridge-zipalign-lib.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Collect zipalign runtime
        run: |
          BT=$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)")
          mkdir -p zipalign-runtime
          cp "$BT/zipalign" zipalign-runtime/zipalign
          LIBCPP=$(ldd "$BT/zipalign" | awk '/libc\+\+\.so/{print $3; exit}')
          echo "LIBCPP=$LIBCPP"
          test -n "$LIBCPP"
          cp "$LIBCPP" zipalign-runtime/libc++.so
          ldd "$BT/zipalign"
          ls -lh zipalign-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: zipalign-runtime
          path: zipalign-runtime
          retention-days: 1
